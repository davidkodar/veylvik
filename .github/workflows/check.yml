name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install software Vulkan
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Vulkan references (adapter required)
        run: cargo test --workspace --locked -- --ignored --nocapture --test-threads=1
        env:
          XDG_RUNTIME_DIR: /tmp
