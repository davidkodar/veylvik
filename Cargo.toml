[workspace]
members = ["crates/veylvik-color", "crates/veylvik-document", "crates/veylvik-render", "crates/veylvik-cli", "crates/veylvik-io", "crates/veylvik-studio", "crates/veylvik-editor", "crates/veylvik-control", "crates/veylvik-text", "crates/veylvik-decode", "crates/veylvik-interop", "crates/veylvik-track", "crates/veylvik-segment", "crates/veylvik-audio", "crates/veylvik-mesh", "crates/veylvik-scene", "crates/veylvik-render3d", "crates/veylvik-solve", "crates/veylvik-expr", "crates/veylvik-preview", "crates/veylvik-presets", "crates/veylvik-shader", "crates/veylvik-warp", "crates/veylvik-splat", "crates/veylvik-nuke", "crates/veylvik-ofx", "crates/veylvik-figure", "crates/veylvik-look", "crates/veylvik-trace"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "vulkan", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
veylvik-document = { path = "crates/veylvik-document" }
veylvik-render = { path = "crates/veylvik-render" }
veylvik-io = { path = "crates/veylvik-io" }
veylvik-control = { path = "crates/veylvik-control" }
veylvik-text = { path = "crates/veylvik-text" }
veylvik-track = { path = "crates/veylvik-track" }
veylvik-segment = { path = "crates/veylvik-segment" }
veylvik-audio = { path = "crates/veylvik-audio" }
veylvik-mesh = { path = "crates/veylvik-mesh" }
veylvik-figure = { path = "crates/veylvik-figure" }
veylvik-look = { path = "crates/veylvik-look" }
veylvik-trace = { path = "crates/veylvik-trace" }
veylvik-scene = { path = "crates/veylvik-scene" }
veylvik-render3d = { path = "crates/veylvik-render3d" }
veylvik-solve = { path = "crates/veylvik-solve" }
veylvik-expr = { path = "crates/veylvik-expr" }
veylvik-preview = { path = "crates/veylvik-preview" }
veylvik-presets = { path = "crates/veylvik-presets" }
veylvik-shader = { path = "crates/veylvik-shader" }
veylvik-warp = { path = "crates/veylvik-warp" }
veylvik-splat = { path = "crates/veylvik-splat" }
veylvik-nuke = { path = "crates/veylvik-nuke" }
veylvik-ofx = { path = "crates/veylvik-ofx" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
